<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Two Brain Cells — Srithea Seshen</title>

    <meta
        name="description"
        content="Two Brain Cells by Srithea Seshen."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet"
    >


    <style>

        :root {

            --ocean: #082F35;
            --deep: #06262B;

            --botanical: #F3F5F1;

            --mist: #8FB0AE;

            --ink: #102D30;

            --red: #A8324A;

            --muted: #587274;
        }


        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            background:
                var(--botanical);

            color:
                var(--ink);

            font-family:
                "DM Sans",
                Arial,
                sans-serif;

            -webkit-font-smoothing:
                antialiased;
        }


        a {

            color: inherit;

            text-decoration: none;
        }


        nav {

            padding:
                34px 7%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom:
                1px solid
                rgba(16,45,48,0.12);
        }


        .logo {

            font-family:
                "Libre Baskerville",
                Georgia,
                serif;

            font-size: 0.86rem;

            letter-spacing:
                0.105em;
        }


        .back {

            font-size: 0.61rem;

            letter-spacing:
                0.2em;

            text-transform:
                uppercase;

            color:
                var(--muted);
        }


        .book-page {

            min-height:
                calc(100vh - 100px);

            display:
                flex;

            align-items:
                center;

            padding:
                100px 8%;
        }


        .book-inner {

            max-width:
                900px;

            width: 100%;

            margin:
                auto;
        }


        .label {

            margin:
                0 0 28px;

            font-size:
                0.61rem;

            letter-spacing:
                0.31em;

            text-transform:
                uppercase;

            color:
                var(--muted);
        }


        h1 {

            margin: 0;

            font-family:
                "Libre Baskerville",
                Georgia,
                serif;

            font-size:
                clamp(
                    3.5rem,
                    9vw,
                    7rem
                );

            font-weight:
                400;

            line-height:
                0.95;

            letter-spacing:
                -0.06em;
        }


        .line {

            width: 45px;

            height: 1px;

            background:
                var(--red);

            margin:
                42px 0;
        }


        .more {

            font-family:
                "Libre Baskerville",
                Georgia,
                serif;

            font-style:
                italic;

            font-size:
                1.15rem;

            color:
                var(--muted);
        }


        .marks {

            display:
                flex;

            gap: 8px;

            margin-top:
                70px;
        }


        .marks span {

            width: 3px;

            height: 3px;

            border-radius:
                50%;

            background:
                var(--red);
        }


        footer {

            padding:
                30px 8%;

            background:
                var(--deep);

            color:
                var(--mist);

            font-size:
                0.57rem;

            letter-spacing:
                0.17em;

            text-transform:
                uppercase;

            display:
                flex;

            justify-content:
                space-between;
        }


        @media (max-width: 700px) {

            nav {

                padding:
                    25px 6%;
            }


            .book-page {

                padding:
                    80px 7%;
            }


            footer {

                flex-direction:
                    column;

                gap:
                    12px;
            }

        }

    </style>

</head>


<body>


    <nav>

        <a
            href="index.html"
            class="logo"
        >
            Srithea Seshen
        </a>


        <a
            href="index.html#works"
            class="back"
        >
            ← The Work
        </a>

    </nav>


    <main>

        <section class="book-page">

            <div class="book-inner">


                <p class="label">
                    The Alchemy · Standalone
                </p>


                <h1>
                    Two<br>
                    Brain Cells
                </h1>


                <div class="line"></div>


                <p class="more">
                    More soon.
                </p>


                <div
                    class="marks"
                    aria-hidden="true"
                >

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <span>
            © 2026 Srithea Seshen
        </span>

        <span>
            Two Brain Cells
        </span>

    </footer>


</body>

</html>
