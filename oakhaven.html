<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Oakhaven Duology — Srithea Seshen</title>

    <meta
        name="description"
        content="The Oakhaven Duology by Srithea Seshen."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet"
    >


    <style>

        :root {

            --ocean: #082F35;
            --deep: #06262B;

            --botanical: #F3F5F1;

            --green: #174A3C;

            --mist: #8FB0AE;

            --red: #A8324A;

            --muted: #587274;
        }


        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background:
                var(--ocean);

            color:
                var(--botanical);

            font-family:
                "DM Sans",
                Arial,
                sans-serif;
        }


        a {

            color: inherit;

            text-decoration: none;
        }


        nav {

            padding:
                34px 7%;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            border-bottom:
                1px solid
                rgba(243,245,241,0.13);
        }


        .logo {

            font-family:
                "Libre Baskerville",
                Georgia,
                serif;

            font-size:
                0.86rem;

            letter-spacing:
                0.105em;
        }


        .back {

            font-size:
                0.61rem;

            letter-spacing:
                0.2em;

            text-transform:
                uppercase;

            color:
                var(--mist);
        }


        main {

            max-width:
                1100px;

            margin:
                auto;

            padding:
                120px 7%
                150px;
        }


        .label {

            margin:
                0 0 27px;

            font-size:
                0.61rem;

            letter-spacing:
                0.31em;

            text-transform:
                uppercase;

            color:
                var(--mist);
        }


        h1 {

            margin: 0;

            font-family:
                "Libre Baskerville",
                Georgia,
                serif;

            font-size:
                clamp(
                    3.5rem,
                    8vw,
                    6.5rem
                );

            font-weight:
                400;

            line-height:
                0.96;

            letter-spacing:
                -0.06em;
        }


        .line {

            width:
                45px;

            height:
                1px;

            margin:
                45px 0;

            background:
                var(--red);
        }


        .more {

            font-family:
                "Libre Baskerville",
                Georgia,
                serif;

            font-style:
                italic;

            color:
                #C9D8D6;

            font-size:
                1.1rem;
        }


        .books {

            margin-top:
                110px;

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                20px;
        }


        .book {

            min-height:
                310px;

            padding:
                42px;

            border:
                1px solid
                rgba(243,245,241,0.14);

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                flex-end;

            transition:
                background 0.35s ease,
                transform 0.35s ease;
        }


        .book:hover {

            background:
                rgba(243,245,241,0.045);

            transform:
                translateY(-4px);
        }


        .number {

            margin:
                0 0 15px;

            color:
                #C65A68;

            font-family:
                "Libre Baskerville",
                Georgia,
                serif;
        }


        h2 {

            margin: 0;

            font-family:
                "Libre Baskerville",
                Georgia,
                serif;

            font-size:
                clamp(
                    1.7rem,
                    3vw,
                    2.4rem
                );

            font-weight:
                400;
        }


        .book p:last-child {

            margin:
                15px 0 0;

            font-size:
                0.58rem;

            letter-spacing:
                0.2em;

            text-transform:
                uppercase;

            color:
                var(--mist);
        }


        footer {

            padding:
                30px 8%;

            background:
                var(--deep);

            color:
                var(--mist);

            font-size:
                0.57rem;

            letter-spacing:
                0.17em;

            text-transform:
                uppercase;

            display:
                flex;

            justify-content:
                space-between;
        }


        @media (max-width: 700px) {

            main {

                padding:
                    90px 7%
                    110px;
            }


            .books {

                grid-template-columns:
                    1fr;

                margin-top:
                    80px;
            }


            .book {

                min-height:
                    250px;
            }


            footer {

                flex-direction:
                    column;

                gap:
                    12px;
            }

        }

    </style>

</head>


<body>


    <nav>

        <a
            href="index.html"
            class="logo"
        >
            Srithea Seshen
        </a>


        <a
            href="index.html#works"
            class="back"
        >
            ← The Work
        </a>

    </nav>


    <main>


        <p class="label">
            A duology
        </p>


        <h1>
            The Oakhaven<br>
            Duology
        </h1>


        <div class="line"></div>


        <p class="more">
            More soon.
        </p>


        <div class="books">


            <a
                href="hearth-and-heritage.html"
                class="book"
            >

                <div>

                    <p class="number">
                        I
                    </p>

                    <h2>
                        Hearth &amp; Heritage
                    </h2>

                    <p>
                        The Oakhaven Duology
                    </p>

                </div>

            </a>


            <a
                href="in-deep-water.html"
                class="book"
            >

                <div>

                    <p class="number">
                        II
                    </p>

                    <h2>
                        In Deep Water
                    </h2>

                    <p>
                        The Oakhaven Duology
                    </p>

                </div>

            </a>


        </div>

    </main>


    <footer>

        <span>
            © 2026 Srithea Seshen
        </span>

        <span>
            The Oakhaven Duology
        </span>

    </footer>


</body>

</html>
